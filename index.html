<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08060A" />
    <!-- Title and description mirror COPY.meta in src/content/copy.ts, which
         tools/prerender.mjs writes over these at build time along with the
         Open Graph tags, the canonical link and the structured data. -->
    <meta
      name="description"
      content="The Total Transformation Protocol by Ikram Ansari: personalised nutrition, training and weekly coaching for busy professionals who are done with quick fixes. Ten plus years. Zero fad diets."
    />
    <title>Fitoholix | Personalised Transformation Coaching for Busy Professionals</title>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: the only two preloads besides frame zero and the masthead (§4.2). -->
    <link rel="preload" href="/fonts/inter-tight-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The masthead logo is on screen from the first paint now that there is
         no preloader in front of it, so it is fetched during HTML parse rather
         than discovered when the bundle renders. No priority hint: frame zero
         and the fonts matter more, and this is 28 KB. -->
    <link rel="preload" as="image" href="/brand/lockup.webp" />

    <!-- Frame zero starts fetching during HTML parse, before any JS executes (§7.3).
         as="image", matched by an Image() in FrameLoader.primeFirstFrame: image
         preloads match the real request reliably, where an as="fetch" preload
         did not (Chrome rejected it on credentials mode) and a worker fetch
         cannot consume a preload at all, since preloads are document scoped.
         media picks a single tier, mirroring the thresholds in selectTier(), so
         exactly one file is ever fetched.

         The aspect split has to appear on every one of these: without it a
         phone matches (max-width: 999px), preloads the landscape crop, and then
         requests the portrait plate instead — a wasted fetch and the "preloaded
         but not used" warning. 65/100 is PORTRAIT_MAX_ASPECT in manifest.ts;
         the two must move together.

         The constrained portrait tier (pvs, 608) depends on connection and
         memory, which no media query can express, so it goes unpreloaded. That
         is already true of the landscape tiers on a save-data connection. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/film/810/f_000.webp"
      media="(max-aspect-ratio: 65/100)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/film/854/f_000.webp"
      media="(min-aspect-ratio: 651/1000) and (max-width: 999px)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/film/1280/f_000.webp"
      media="(min-aspect-ratio: 651/1000) and (min-width: 1000px) and (max-width: 1599px)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/film/1920/f_000.webp"
      media="(min-aspect-ratio: 651/1000) and (min-width: 1600px)"
    />

    <style>
      /* Pre-hydration ground: the page is ink from the first byte, CLS 0. */
      html {
        background: linear-gradient(180deg, #0a0710 0%, #171016 100%);
        background-color: #08060a;
      }

      /* ==========================================================
         THE ENTRANCE, without JavaScript.

         There is no preloader: the hero is the first paint, and the headline
         is never hidden, because it is the largest thing on the screen and
         the one a visitor came for. The elements around it (the eyebrow, the
         lead, the buttons, the scroll cue) arrive a beat later so the page
         reads as composed rather than dumped.

         This is the version that runs when the bundle has not arrived yet, or
         never does: a CSS animation from the moment each element is painted,
         held at nothing for 800ms and then in over 320ms. If the bundle is
         running by then it sets data-entrance on <html>, which cancels this
         and hands the same elements to the timed sequence in
         motion/choreography.ts. If it arrives later than that, it leaves this
         alone and the page simply is there. Under reduced motion nothing is
         ever held back.
         ========================================================== */
      [data-s1-eyebrow],
      [data-s1-lead],
      [data-s1-actions],
      [data-s1-detail],
      [data-scroll-cue] {
        animation: s1Reveal 320ms cubic-bezier(0.22, 1, 0.36, 1) 800ms both;
      }
      @keyframes s1Reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      html[data-entrance] [data-s1-eyebrow],
      html[data-entrance] [data-s1-lead],
      html[data-entrance] [data-s1-actions],
      html[data-entrance] [data-s1-detail],
      html[data-entrance] [data-scroll-cue] {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        [data-s1-eyebrow],
        [data-s1-lead],
        [data-s1-actions],
        [data-s1-detail],
        [data-scroll-cue] {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
