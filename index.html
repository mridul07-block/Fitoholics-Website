<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100E0D" />
    <meta
      name="description"
      content="Ikram Ansari. Transformation coach for busy professionals. The Total Transformation Protocol: lifelong habits, not temporary fixes."
    />
    <title>Ikram Ansari · Transformation Coach</title>

    <!-- Fonts: the only two preloads besides frame zero (§4.2). -->
    <link rel="preload" href="/fonts/bodoni-moda-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Frame zero starts fetching during HTML parse, before any JS executes (§7.3). -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="/film/854/f_000.webp 854w, /film/1280/f_000.webp 1280w, /film/1920/f_000.webp 1920w"
      imagesizes="100vw"
    />

    <style>
      /* Pre-hydration ground: the page is ink from the first byte, CLS 0. */
      html {
        background: #100e0d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
